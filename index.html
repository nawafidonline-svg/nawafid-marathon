<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ماراثون نوافذ: كل دروس المقطع في فيديو واحد مع أساتذة منصة نوافذ، ودروس الدعم عن بعد عبر الزوم.">
<link rel="icon" href="nw_head.webp">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>ماراثون نوافذ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800;900&family=Readex+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: every teacher stands in a lit Nawafid window (نافذة) on a night race course; marathons are race bibs, lessons are stations on the lane. */
:root {
  --ink: #06131a;          /* night */
  --deep: #0a2029;         /* stage */
  --panel: #0e2a34;        /* raised surfaces */
  --line: rgba(170, 230, 225, 0.13);
  --fg: #eef7f5;
  --muted: #93b3b1;
  --teal: #20b2aa;         /* Nawafid teal */
  --gold: #f2bf3a;         /* Nawafid gold */
  --acc: #f2bf3a;          /* the teacher's subject color, set per page */
  --on-acc: #1d1400;
  --paper: #f7f3e8;        /* race bib */
  --tint: rgba(255, 255, 255, 0.06);       /* hover / chip fill */
  --sunk: rgba(0, 0, 0, 0.22);             /* recessed boxes */
  --line-strong: rgba(255, 255, 255, 0.25);
  --acc-text: var(--acc);                  /* subject color used as text */
  --glow: color-mix(in srgb, var(--teal) 22%, transparent);
  --display: "Alexandria", "Segoe UI", Tahoma, sans-serif;
  --body: "Readex Pro", "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
}
/* day mode: paper-white page, ink text; the hero stage, portraits and join band stay lit like a night window */
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --ink: #edf4f3; --deep: #ffffff; --panel: #ffffff; --line: rgba(12, 70, 80, 0.14); --fg: #0f2a33; --muted: #557073;
  --tint: rgba(12, 70, 80, 0.06); --sunk: rgba(12, 70, 80, 0.05); --line-strong: rgba(12, 70, 80, 0.3);
  --acc-text: color-mix(in srgb, var(--acc) 55%, #13262c); --glow: color-mix(in srgb, var(--teal) 14%, transparent); color-scheme: light; } }
:root[data-theme="light"] {
  --ink: #edf4f3; --deep: #ffffff; --panel: #ffffff; --line: rgba(12, 70, 80, 0.14); --fg: #0f2a33; --muted: #557073;
  --tint: rgba(12, 70, 80, 0.06); --sunk: rgba(12, 70, 80, 0.05); --line-strong: rgba(12, 70, 80, 0.3);
  --acc-text: color-mix(in srgb, var(--acc) 55%, #13262c); --glow: color-mix(in srgb, var(--teal) 14%, transparent); color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
/* surfaces that are always night: re-declare the dark tokens locally */
.stage, .join, .portrait { --deep: #0a2029; --panel: #0e2a34; --line: rgba(170, 230, 225, 0.13); --fg: #eef7f5; --muted: #a3c0be;
  --tint: rgba(255, 255, 255, 0.06); --sunk: rgba(0, 0, 0, 0.22); --acc-text: var(--acc); color: var(--fg); }
.theme-btn { background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 12px; width: 44px; height: 44px; cursor: pointer; display: inline-grid; place-items: center; }
.theme-btn svg { width: 20px; height: 20px; fill: currentColor; }
.theme-btn .sun { display: none; }
:root[data-mode="dark"] .theme-btn .sun { display: block; }
:root[data-mode="dark"] .theme-btn .moon { display: none; }
* { box-sizing: border-box; }
body {
  background: radial-gradient(900px 520px at 85% -5%, var(--glow), transparent 65%), var(--ink);
  color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.75; direction: rtl;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px; min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
.wrap { max-width: 1280px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); line-height: 1.2; text-wrap: balance; margin: 0; }
a { color: inherit; }
button { font: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 3px; border-radius: 10px; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px; background: color-mix(in srgb, var(--ink) 86%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand .logo { background: #fff; border-radius: 12px; padding: 5px; width: 44px; height: 44px; display: grid; place-items: center; }
.brand .mascot { width: 50px; height: 50px; flex: none; display: grid; place-items: center; }
.brand .mascot img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3)); transition: transform .2s ease; }
.brand:hover .mascot img { transform: rotate(-6deg) scale(1.06); }
.brand b { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -0.2px; white-space: nowrap; }
.brand b span { color: var(--gold); }
.bar-end { display: flex; gap: 10px; align-items: center; }
.cta-mini { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--on-acc); background: var(--gold); border-radius: 999px;
  padding: 8px 18px; text-decoration: none; white-space: nowrap; }
.menu-btn { display: none; background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 12px; width: 44px; height: 44px; cursor: pointer; }
.menu-btn svg { width: 22px; height: 22px; fill: currentColor; }

/* Nawwaf runs along the bottom edge of the header as the page scrolls: start on the right, finish flag on the left */
.runlane { position: absolute; left: 0; right: 0; bottom: -2px; height: 3px; background: var(--tint); pointer-events: none; --p: 0; }
.runlane .fill { position: absolute; top: 0; bottom: 0; right: 0; width: calc(var(--p) * 100%); background: linear-gradient(270deg, var(--teal), var(--acc)); border-radius: 2px; }
.runmini { position: absolute; bottom: 1px; right: calc(var(--p) * (100% - 30px)); height: 30px; scale: -1 1; transition: right .12s linear;
  filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); animation: hop .45s ease-in-out infinite alternate; }
.runlane .flag { position: absolute; left: 0; bottom: 2px; width: 14px; height: 14px; border-radius: 3px; }
@keyframes hop { to { translate: 0 -3px; } }
.runlane.done .runmini { animation: none; }

/* tilted motivational banners */
.bands { position: relative; height: 128px; margin-top: 26px; overflow: hidden; border-radius: 22px; }
.band { position: absolute; left: -6%; right: -6%; white-space: nowrap; overflow: hidden; padding-block: 11px; font-family: var(--display); font-weight: 800; font-size: 20px; }
.band.b1 { top: 22px; z-index: 1; transform: rotate(-2.6deg); color: var(--on-acc); background: linear-gradient(90deg, var(--acc), color-mix(in srgb, var(--acc) 65%, #fff), var(--acc));
  box-shadow: 0 12px 30px color-mix(in srgb, var(--acc) 30%, transparent); }
.band.b2 { top: 66px; transform: rotate(2deg); color: var(--fg); background: var(--panel); border-block: 1px solid var(--line); font-size: 18px; opacity: 0.9; }
.band .row { display: inline-flex; gap: 30px; padding-inline: 15px; animation: marq 42s linear infinite; }
.band.b2 .row { animation-direction: reverse; animation-duration: 55s; }
.band .row span { display: inline-flex; align-items: center; gap: 30px; }
.band .row span::after { content: "✦"; font-size: 0.7em; opacity: 0.7; }
@keyframes marq { from { transform: translateX(0); } to { transform: translateX(50%); } }

/* sections rise gently into place as they come into view (always visible, never hidden) */
.rv { opacity: 0.35; transform: translateY(26px) scale(0.985); }
.rv-in { opacity: 1; transform: none; transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }

/* ---------- shell + side menu ---------- */
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 28px; align-items: start; margin-top: 22px; }
.shell.solo { grid-template-columns: minmax(0, 1fr); }
.shell.solo .side { display: none; }
#app { min-width: 0; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); max-height: calc(100vh - 104px); overflow-y: auto;
  background: linear-gradient(180deg, var(--panel), var(--deep)); border: 1px solid var(--line); border-radius: 22px; padding: 16px 12px; }
.who { display: flex; align-items: center; gap: 12px; text-decoration: none; padding: 4px 6px 14px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.who b { font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1.35; display: block; }
.who small { color: var(--acc-text); font-size: 13px; font-weight: 500; }
.mini-arch { width: 52px; height: 62px; flex: none; position: relative; border-radius: 26px 26px 8px 8px; overflow: hidden;
  background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--acc) 55%, transparent), transparent 70%), var(--deep);
  border: 1.5px solid color-mix(in srgb, var(--acc) 70%, transparent); }
.mini-arch img { position: absolute; top: 6%; left: 50%; transform: translateX(-50%); height: 230%; max-width: none; } /* head-and-shoulders crop of the full photo */
.mini-arch .initials { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 24px; color: var(--acc); }
.side h4 { font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.4px; margin: 14px 8px 6px; }
.side ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.side ul ul { margin: 0 18px 4px 0; padding-right: 10px; border-right: 2px dashed var(--line); }
.side a, .side .off { display: flex; align-items: center; gap: 10px; text-decoration: none; padding: 7px 10px; border-radius: 12px; font-size: 15px; line-height: 1.4; }
.side a:hover { background: var(--tint); }
.side a.on { background: color-mix(in srgb, var(--acc) 16%, transparent); color: var(--fg); font-weight: 600; box-shadow: inset -3px 0 0 var(--acc); }
.side .off { color: var(--muted); }
.side .sm { font-size: 14px; color: var(--muted); }
.side .sm.on { color: var(--fg); }
.lvl { font-family: var(--display); font-weight: 800; font-size: 12px; min-width: 34px; text-align: center; padding: 1px 6px; border-radius: 8px;
  background: color-mix(in srgb, var(--acc) 20%, transparent); color: var(--acc-text); }
.pill { margin-inline-start: auto; font-size: 11px; border-radius: 999px; padding: 0 8px; background: var(--tint); color: var(--muted); }
.sico { width: 28px; height: 28px; border-radius: 9px; background: var(--c); display: grid; place-items: center; flex: none; }
.sico svg { width: 15px; height: 15px; fill: #fff; }
.scrim { display: none; }

/* ---------- the stage: hero of every page ---------- */
.stage { position: relative; isolation: isolate; border-radius: 30px; overflow: hidden; border: 1px solid var(--line);
  background:
    radial-gradient(520px 420px at 22% 40%, color-mix(in srgb, var(--acc) 26%, transparent), transparent 70%),
    linear-gradient(160deg, #0d2c37 0%, var(--deep) 55%, #081920 100%); }
.stage::before { /* a faint grid of window panes */
  content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0.55;
  background-image: linear-gradient(rgba(255,255,255,0.045) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,255,255,0.045) 1.5px, transparent 1.5px);
  background-size: 56px 56px; mask-image: radial-gradient(ellipse at 30% 40%, #000 10%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at 30% 40%, #000 10%, transparent 70%); }
/* subject room photo: detail on the teacher's side, fading to the dark stage under the text */
.stage.has-bg { background:
    linear-gradient(270deg, #0a2029 0%, rgba(10, 32, 41, 0.94) 36%, rgba(10, 32, 41, 0.45) 60%, rgba(10, 32, 41, 0.12) 100%),
    var(--bgimg) left center / cover no-repeat, var(--deep); }
.stage.has-bg::before { opacity: 0.2; }
.has-bg .pane { background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--acc) 38%, transparent), transparent 70%), rgba(8, 30, 38, 0.5);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.glyph { position: absolute; z-index: -1; font-family: var(--display); font-weight: 900; color: var(--acc); opacity: 0.11; line-height: 1; pointer-events: none; user-select: none; direction: ltr; }
.stage-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: end; padding: 40px 44px 0; }
/* the subject's world drawn behind the teacher: chalk-line art in the subject color */
.scene { position: absolute; z-index: -1; left: 0; top: 0; bottom: 66px; width: 54%; pointer-events: none; opacity: 0.32;
  -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 40%, transparent 100%); mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 40%, transparent 100%); }
.scene svg { width: 100%; height: 100%; }
.scene .ln { fill: none; stroke: var(--acc); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.scene .thin { stroke-width: 1.5; opacity: 0.6; }
.scene .tx { fill: var(--acc); font-family: var(--display); font-weight: 800; }
.copy { padding-bottom: 44px; min-width: 0; }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--acc); letter-spacing: 0.2px; margin: 0 0 18px; }
.panes { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 16px; height: 16px; }
.panes i { background: currentColor; border-radius: 2px; }
.panes i:last-child { background: transparent; border: 1.5px solid currentColor; }
.name { font-weight: 900; font-size: clamp(38px, 5vw, 70px); letter-spacing: -0.5px; line-height: 1.15; }
.name .u { -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.name small { display: block; font-size: 0.32em; font-weight: 700; letter-spacing: 0; color: var(--muted); margin-bottom: 8px; }
.name .u { background: linear-gradient(transparent 72%, color-mix(in srgb, var(--acc) 45%, transparent) 72%, color-mix(in srgb, var(--acc) 45%, transparent) 92%, transparent 92%); padding-inline: 4px; }
.lede { color: var(--muted); font-size: 18px; max-width: 46ch; margin: 18px 0 0; }

/* race clock */
.clock { display: inline-grid; grid-auto-flow: column; margin-top: 26px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: rgba(0, 0, 0, 0.28); }
.clock div { padding: 10px 22px 12px; display: flex; flex-direction: column; gap: 2px; }
.clock div + div { border-right: 1px solid var(--line); }
.clock b { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.1; color: var(--fg); font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }
.clock b em { font-style: normal; color: var(--acc); }
.clock span { font-size: 13px; color: var(--muted); }

/* socials */
.follow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 24px; }
.follow .lbl { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--muted); margin-inline-end: 6px; }
.soc { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; font-weight: 500; font-size: 14px; color: var(--fg);
  padding: 5px 6px 5px 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line);
  transition: background .18s ease, transform .18s ease, border-color .18s ease; }
.soc:hover { background: color-mix(in srgb, var(--c) 30%, transparent); border-color: color-mix(in srgb, var(--c) 70%, transparent); transform: translateY(-2px); }
.soc .sico { width: 30px; height: 30px; border-radius: 50%; }

/* the window the teacher stands in */
.window { position: relative; height: clamp(420px, 44vw, 600px); width: 100%; max-width: 520px; margin-inline: auto; align-self: end; }
.window::before { /* outer frame */
  content: ""; position: absolute; inset: calc(14% - 11px) calc(6% - 11px) -1px; border-radius: 230px 230px 0 0;
  border: 1.5px solid color-mix(in srgb, var(--acc) 45%, transparent); border-bottom: 0; }
.pane { position: absolute; inset: 14% 6% 0; border-radius: 220px 220px 0 0; overflow: hidden;
  background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--acc) 50%, transparent), transparent 68%), linear-gradient(180deg, #164555, #0b2530);
  box-shadow: inset 0 0 0 7px rgba(255, 255, 255, 0.04), inset 0 -60px 80px rgba(0, 0, 0, 0.35); }
.pane::before, .pane::after { content: ""; position: absolute; background: rgba(255, 255, 255, 0.08); }
.pane::before { top: 0; bottom: 0; left: calc(50% - 3px); width: 6px; }          /* mullion */
.pane::after { left: 0; right: 0; top: 46%; height: 6px; }                        /* transom */
.figure { position: absolute; inset: 0 6% 0; overflow: hidden; }   /* clips the sides to the pane, leaves the head free above the arch */
.teacher { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 100%; width: auto; max-width: none;
  filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.55)); }
.window .initials { position: absolute; inset: 14% 6% 0; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 140px; color: var(--acc); opacity: 0.85; }
.sill { position: absolute; bottom: 0; left: 2%; right: 2%; height: 14px; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, color-mix(in srgb, var(--acc) 85%, #fff), var(--acc)); box-shadow: 0 -6px 24px color-mix(in srgb, var(--acc) 45%, transparent); }
/* a photo whose right edge is already cut: show it whole and lean that edge on the window frame so the cut hides behind it */
.figure.edge-right .teacher { left: auto; right: 0; transform: none; width: 100%; height: auto; max-height: 100%; object-fit: contain; object-position: 100% 100%; }
/* a wide photo (plaque, raised hand) shown whole inside the pane */
.figure.edge-contain .teacher { width: 100%; height: auto; max-height: 100%; }
/* animated subject object floating at the window's top-left corner (the arch leaves that corner empty) */
.fx { position: absolute; z-index: 3; left: -11%; top: -5%; width: 46%; height: 56%; pointer-events: none;
  filter: drop-shadow(0 0 14px color-mix(in srgb, var(--acc) 55%, transparent)); }
.badge-subj { position: absolute; top: 15%; right: 0; transform: rotate(6deg); z-index: 4; font-family: var(--display); font-weight: 800; font-size: 15px; color: var(--on-acc);
  background: var(--acc); padding: 6px 14px; border-radius: 10px; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35); }

/* race lane along the bottom of the stage */
.lane { position: relative; height: 66px; border-top: 1px solid var(--line); background: rgba(0, 0, 0, 0.22); }
.lane::before { content: ""; position: absolute; left: 70px; right: 120px; top: 50%; height: 3px; transform: translateY(-50%);
  background: repeating-linear-gradient(270deg, rgba(255, 255, 255, 0.28) 0 26px, transparent 26px 46px); }
.lane .start, .lane .finish { position: absolute; top: 50%; transform: translateY(-50%); font-family: var(--display); font-weight: 700; font-size: 12px; color: var(--muted); }
.lane .start { right: 24px; }
.lane .finish { left: 18px; display: flex; align-items: center; gap: 8px; }
.flag { width: 22px; height: 22px; border-radius: 4px; background: conic-gradient(#fff 25%, #111 0 50%, #fff 0 75%, #111 0) 0 0 / 11px 11px; }
.runner { position: absolute; bottom: 6px; right: 110px; height: 74px; scale: -1 1; /* faces the finish line on the left */animation: run 2.2s cubic-bezier(.3,.7,.3,1) .3s both, bob 1.6s ease-in-out 2.5s infinite; }
@keyframes run { from { right: 50px; opacity: 0; } to { right: 110px; opacity: 1; } }
@keyframes bob { 50% { transform: translateY(-5px); } }

/* ---------- sections ---------- */
.sec { display: flex; align-items: baseline; gap: 14px; margin-block: 48px 18px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 90px); }
.sec h2 { font-size: 26px; font-weight: 800; white-space: nowrap; }
.sec small { color: var(--muted); font-size: 14px; white-space: nowrap; }
.sec::after { content: ""; flex: 1; align-self: center; height: 2px; background: repeating-linear-gradient(270deg, var(--line) 0 14px, transparent 14px 24px); }
.grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }

/* marathon card with a race bib */
.mcard { position: relative; display: flex; flex-direction: column; min-width: 0; text-decoration: none; border-radius: 22px; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease; }
a.mcard:hover { transform: translateY(-5px); border-color: color-mix(in srgb, var(--acc) 60%, transparent); box-shadow: 0 22px 40px rgba(0, 0, 0, 0.4); }
.mcard .thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--deep); overflow: hidden; }
.mcard .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
a.mcard:hover .thumb img { transform: scale(1.04); }
.mcard .thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(6, 19, 26, 0.75), transparent 45%); }
.play-dot { position: absolute; z-index: 1; left: 14px; bottom: 12px; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  background: var(--acc); color: var(--on-acc); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); }
.play-dot svg { width: 20px; height: 20px; fill: currentColor; margin-left: 3px; }
.bib { position: absolute; z-index: 1; top: 12px; right: 12px; background: var(--paper); color: #10232a; border-radius: 8px; padding: 6px 12px 5px;
  text-align: center; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35); transform: rotate(-3deg); min-width: 74px; }
.bib::before, .bib::after { content: ""; position: absolute; top: 5px; width: 5px; height: 5px; border-radius: 50%; background: #b9b2a0; }
.bib::before { right: 6px; } .bib::after { left: 6px; }
.bib small { display: block; font-size: 9px; font-weight: 600; letter-spacing: 0.5px; color: #6c6a60; line-height: 1.4; }
.bib b { display: block; font-family: var(--display); font-weight: 900; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
.mcard .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; }
.mcard h3 { font-size: 19px; font-weight: 700; }
.meta { color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; font-weight: 500; border-radius: 8px; padding: 2px 10px; background: var(--tint); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.chip.acc { background: color-mix(in srgb, var(--acc) 18%, transparent); border-color: color-mix(in srgb, var(--acc) 40%, transparent); color: var(--fg); }
.mcard.soon .thumb { display: grid; place-items: center; }
.mcard.soon .thumb::after { display: none; }
.mcard.soon .thumb img { width: auto; height: 62%; object-fit: contain; }

/* wide marathon "lane": thumbnail + the seven stations + progress, across the full width */
.mlane { position: relative; isolation: isolate; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 0;
  border-radius: 24px; border: 1px solid var(--line); background: var(--panel); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12); }
.mlane::before { /* the subject's room, barely there */
  content: ""; position: absolute; inset: 0; z-index: -2; background: var(--bgimg) left center / cover no-repeat; opacity: 0.09;
  -webkit-mask-image: linear-gradient(270deg, transparent 30%, #000); mask-image: linear-gradient(270deg, transparent 30%, #000); }
.mlane::after { /* running-track lanes */
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: repeating-linear-gradient(180deg, transparent 0 46px, color-mix(in srgb, var(--acc) 14%, transparent) 46px 48px); opacity: 0.6;
  -webkit-mask-image: linear-gradient(270deg, transparent 38%, #000 100%); mask-image: linear-gradient(270deg, transparent 38%, #000 100%); }
.mthumb { position: relative; display: block; align-self: center; margin: 16px; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; border-radius: 16px;
  background: var(--deep); box-shadow: 0 14px 30px rgba(0, 0, 0, 0.3); }
.mthumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.mthumb:hover img { transform: scale(1.04); }
.mthumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(6, 19, 26, 0.55), transparent 50%); }
.mbody { padding: 20px 24px 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.mbody h3 { font-size: 22px; font-weight: 800; }
.mprog { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; }
.mprog span { font-size: 13px; color: var(--muted); }
.mprog .meter { grid-column: 1 / -1; margin: 0; position: relative; }
.mprog .flag { width: 16px; height: 16px; border-radius: 3px; }
.mstations { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.mstations li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 14px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.mstations .st { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 11px;
  border: 1.5px solid var(--line-strong); color: var(--muted); font-variant-numeric: tabular-nums; }
.mstations li.done .st { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.mstations li.next .st { border-color: var(--acc); color: var(--acc-text); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 20%, transparent); }
.mstations .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mstations .tm { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; direction: ltr; }
.mfoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
.go { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-family: var(--display); font-weight: 700; font-size: 15px;
  color: var(--on-acc); background: var(--acc); padding: 9px 18px; border-radius: 12px; }
.go svg { width: 16px; height: 16px; fill: currentColor; }
.lanes { display: grid; gap: 22px; }
@media (max-width: 820px) {
  .mlane { grid-template-columns: minmax(0, 1fr); }
  .mthumb { margin: 12px 12px 0; }
  .mbody { padding: 16px; }
}

/* attached PDF files */
.files { margin-top: 18px; padding: 18px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); }
.files-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.files-h svg { width: 22px; height: 22px; fill: var(--acc-text); }
.files-h b { font-family: var(--display); font-weight: 800; font-size: 18px; }
.files-h i { font-style: normal; font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--tint); color: var(--muted); }
/* compact list: one row per file */
.file-list { display: flex; flex-direction: column; gap: 8px; }
.file { --k: #4c8dff; display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 8px 10px 8px 8px; border-radius: 14px;
  border: 1px solid var(--line); border-inline-start: 4px solid var(--k); background: var(--deep); min-width: 0; transition: border-color .2s ease, transform .2s ease; }
.file:hover { transform: translateX(-2px); border-color: color-mix(in srgb, var(--k) 50%, var(--line)); }
.file[data-kind="solution"] { --k: #2fbf71; } .file[data-kind="summary"] { --k: #e8b130; } .file[data-kind="exercises"] { --k: #a07cff; }
.file .pv { position: relative; width: 58px; height: 72px; border-radius: 8px; overflow: hidden; background: #fff; cursor: zoom-in; border: 1px solid var(--line); padding: 0; display: block; }
.file .pv img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.file .pv .pdf { position: absolute; left: 3px; bottom: 3px; font-family: var(--display); font-weight: 800; font-size: 9px; color: #fff; background: #d93025; padding: 1px 4px; border-radius: 4px; }
.file .fb { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.file .fb b { font-weight: 600; font-size: 15px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file .fb small { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.file .kind { font-family: var(--display); font-weight: 800; font-size: 11px; color: #fff; background: var(--k); padding: 1px 8px; border-radius: 6px; }
.file .acts { display: flex; gap: 6px; }
.file .acts a, .file .acts button { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; text-decoration: none; cursor: pointer; border: 0; }
.file .acts .view { background: var(--k); color: #fff; }
.file .acts .dl { background: var(--tint); color: var(--fg); border: 1px solid var(--line); }
.file .acts svg { width: 18px; height: 18px; fill: currentColor; }
@media (max-width: 480px) { .file { grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; } .file .pv { width: 46px; height: 58px; } .file .fb b { white-space: normal; font-size: 14px; } }.chip.clip { display: inline-flex; align-items: center; gap: 4px; }
.chip.clip svg { width: 13px; height: 13px; fill: currentColor; }
/* full-screen PDF viewer */
.pdfdlg { width: min(1000px, 96vw); height: min(92vh, 1200px); padding: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--deep); color: var(--fg); overflow: hidden; }
.pdfdlg::backdrop { background: rgba(3, 10, 14, 0.75); backdrop-filter: blur(3px); }
.pdfdlg .bar2 { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.pdfdlg .bar2 b { flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pdfdlg .bar2 a, .pdfdlg .bar2 button { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 10px; font-family: var(--display); font-weight: 700; font-size: 13px; text-decoration: none; border: 1px solid var(--line); background: var(--tint); color: var(--fg); cursor: pointer; }
.pdfdlg iframe { width: 100%; height: calc(100% - 56px); border: 0; background: #525659; }

/* lesson marathons vs proposed exam models */
.ktabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 6px; margin-bottom: 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
.ktab { display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 11px 12px; border: 0; border-radius: 12px; cursor: pointer;
  font-family: var(--display); font-weight: 800; font-size: 16px; background: transparent; color: var(--muted); }
.ktab svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
.ktab i { font-style: normal; font-size: 12px; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--tint); }
.ktab[aria-selected="true"] { background: var(--acc); color: var(--on-acc); box-shadow: 0 8px 20px color-mix(in srgb, var(--acc) 30%, transparent); }
.ktab[aria-selected="true"] i { background: rgba(0, 0, 0, 0.15); }
@media (max-width: 480px) { .ktab { font-size: 14px; padding: 10px 6px; } }

/* year tabs + the season's route of segments (checkpoints) above one lane card */
.ytabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.ytab { font-family: var(--display); font-weight: 700; font-size: 15px; padding: 8px 18px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.ytab b { font-weight: 800; color: var(--acc-text); }
.ytab[aria-selected="true"] { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.ytab[aria-selected="true"] b { color: inherit; }
.route { list-style: none; margin: 0 0 18px; padding: 8px 4px 4px; display: flex; overflow-x: auto; scrollbar-width: thin; }
.route li { flex: 1 0 104px; position: relative; display: flex; justify-content: center; }
.route li:not(:first-child)::before { /* dashed path back to the previous checkpoint (on the right, RTL) */
  content: ""; position: absolute; z-index: 0; top: 19px; left: 50%; right: -50%; height: 3px;
  background: repeating-linear-gradient(270deg, var(--line-strong) 0 10px, transparent 10px 18px); }
.route li.passed:not(:first-child)::before { background: var(--acc); }
.sdot { position: relative; z-index: 1; background: none; border: 0; padding: 0; color: var(--fg); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; }
.sdot:disabled { cursor: default; }
.sdot i { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--display); font-weight: 800; font-size: 14px;
  background: var(--panel); border: 2px solid var(--acc); color: var(--acc-text); font-variant-numeric: tabular-nums; transition: transform .15s ease, box-shadow .15s ease; }
.sdot.part i { background: radial-gradient(circle, var(--panel) 55%, transparent 57%), conic-gradient(var(--acc) var(--p), var(--tint) 0); }
.sdot.done i { background: var(--acc); color: var(--on-acc); }
.sdot.soon i { border-style: dashed; border-color: var(--line-strong); color: var(--muted); }
.sdot.soon i svg { width: 15px; height: 15px; fill: currentColor; }
.sdot b { font-family: var(--display); font-weight: 700; font-size: 13px; line-height: 1.3; white-space: nowrap; }
.sdot small { font-size: 11px; color: var(--muted); }
.sdot.soon b { color: var(--muted); }
.sdot[aria-current="true"] i { transform: scale(1.12); box-shadow: 0 0 0 5px color-mix(in srgb, var(--acc) 25%, transparent); }
.sdot:not(:disabled):hover i { transform: scale(1.08); }
@media (max-width: 480px) { .ytabs { flex-wrap: nowrap; } .ytab { flex: 1 1 0; justify-content: center; padding: 8px 8px; font-size: 14px; white-space: nowrap; } }

/* how-it-works (landing) */
.steps { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); counter-reset: s; }
.step { position: relative; padding: 22px 22px 22px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); }
.step b { font-family: var(--display); font-size: 19px; font-weight: 700; display: block; margin-top: 10px; }
.step p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.step .big { display: block; font-family: var(--display); font-weight: 900; font-size: 44px; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }

/* ---------- compact header (year + marathon pages) ---------- */
.crumbs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--acc-text); }
.crumbs .sep { opacity: 0.5; }
.head { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; padding: 24px 26px; border-radius: 24px; border: 1px solid var(--line);
  background: radial-gradient(400px 200px at 10% 0%, color-mix(in srgb, var(--acc) 18%, transparent), transparent 70%), var(--deep); }
.head .mini-arch { width: 84px; height: 100px; border-radius: 42px 42px 10px 10px; }
.head > div:last-child { min-width: 0; flex: 1; }
.head h1 { font-size: clamp(28px, 4.4vw, 44px); font-weight: 900; }
.head p { margin: 6px 0 0; color: var(--muted); }

/* marathon page */
.mara { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: start; margin-top: 24px; }
.player { position: relative; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 16 / 9; max-width: 100%; background: var(--deep); }
.player img { width: 100%; height: 100%; object-fit: cover; display: block; }
.player .bib { top: 14px; right: 14px; }
.player .play { position: absolute; left: 16px; bottom: 16px; z-index: 1; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 2; background: #000; }
.player button.btn { border: 0; cursor: pointer; font: inherit; font-family: var(--display); font-weight: 700; font-size: 16px; }
.yt-out { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--muted); text-decoration: none; }
.yt-out:hover { color: var(--acc-text); }
.btn { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 16px; border-radius: 14px; padding: 10px 20px; text-decoration: none; }
.btn.red { background: #e62117; color: #fff; }
.btn.ghost { background: rgba(6, 19, 26, 0.85); color: var(--fg); border: 1px solid var(--line); }
.btn svg { width: 20px; height: 20px; fill: currentColor; }
.facts { margin-top: 14px; }
.progress { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.progress img { height: 92px; filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.45)); scale: -1 1; }
.progress b { font-family: var(--display); font-size: 18px; font-weight: 700; display: block; line-height: 1.4; }
.progress span { color: var(--muted); font-size: 14px; }
.meter { height: 10px; border-radius: 5px; background: var(--tint); margin-top: 10px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(270deg, var(--teal), var(--acc)); transition: width .4s ease; }
.lessons { list-style: none; margin: 0; padding: 0; position: relative; display: flex; flex-direction: column; gap: 10px; }
.lessons::before { content: ""; position: absolute; top: 20px; bottom: 20px; right: 27px; width: 3px; background: repeating-linear-gradient(180deg, var(--line) 0 10px, transparent 10px 18px); }
.lesson { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px 10px 14px; }
.lesson.next { border-color: color-mix(in srgb, var(--acc) 70%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 16%, transparent); }
.station { width: 44px; height: 44px; margin-inline: auto; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 15px;
  background: var(--deep); border: 2px solid var(--line-strong); color: var(--muted); position: relative; z-index: 1; font-variant-numeric: tabular-nums; }
.lesson.done .station { background: var(--acc); border-color: color-mix(in srgb, var(--acc) 60%, #fff); color: var(--on-acc); }
.lesson .t b { display: block; font-weight: 500; font-size: 15.5px; line-height: 1.5; }
.lesson .t a, .lesson .t span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; text-decoration: none; }
.lesson .t a { color: var(--acc-text); }
.check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.check input { width: 20px; height: 20px; accent-color: var(--acc); cursor: pointer; }

/* ---------- remote support classes (Zoom) ---------- */
.support { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 30px; align-items: center; padding: 28px; border-radius: 28px;
  border: 1px solid color-mix(in srgb, var(--acc) 35%, var(--line));
  background: radial-gradient(500px 300px at 85% 0%, color-mix(in srgb, var(--acc) 16%, transparent), transparent 70%), var(--deep); }
/* studio portrait: the teacher alone, lit in the subject color, framed like the Nawafid ads */
.portrait { position: relative; margin: 0; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 24px; overflow: hidden;
  border: 2px solid color-mix(in srgb, var(--gold) 75%, transparent); box-shadow: 0 26px 54px rgba(0, 0, 0, 0.45);
  background:
    radial-gradient(70% 55% at 50% 38%, color-mix(in srgb, var(--acc) 42%, transparent), transparent 72%),
    linear-gradient(180deg, #17707a 0%, #0f4a55 48%, #0a2b33 100%); }
.portrait::before { /* soft studio floor + inner frame */
  content: ""; position: absolute; inset: 10px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.12); z-index: 2; pointer-events: none; }
.portrait::after { content: ""; position: absolute; inset: auto 0 0; height: 38%; z-index: 1; background: linear-gradient(0deg, rgba(5, 20, 26, 0.92), transparent); }
.portrait img { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 94%; width: auto; max-width: 112%; object-fit: contain; object-position: 50% 100%;
  filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.5)); }
.portrait.online img { left: 0; transform: none; width: 100%; height: auto; max-width: 100%; } /* desk photo: the desk spans the card */
.portrait figcaption { position: absolute; z-index: 3; right: 22px; bottom: 20px; display: flex; flex-direction: column; }
.portrait figcaption small { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--gold); }
.portrait figcaption b { font-family: var(--display); font-weight: 900; font-size: clamp(24px, 3vw, 32px); line-height: 1.15; }
.portrait .corner { position: absolute; z-index: 3; top: 18px; left: 18px; width: 14px; height: 14px; border-radius: 3px; background: var(--gold); }
.zoom-tag { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 14px; padding: 5px 12px 5px 6px; border-radius: 10px; background: var(--tint); border: 1px solid var(--line); }
.zoom-tag i { width: 26px; height: 26px; border-radius: 7px; background: #2d8cff; display: grid; place-items: center; }
.zoom-tag svg { width: 15px; height: 15px; fill: #fff; }
.support h2 { font-size: clamp(26px, 3.4vw, 38px); font-weight: 900; margin-top: 14px; }
.support h2 em { font-style: normal; color: var(--acc-text); }
.support .season { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.facts-box { margin-top: 18px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--sunk); }
.facts-box > div { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; }
.facts-box > div + div { border-top: 1px solid var(--line); }
.facts-box dt { color: var(--muted); font-size: 14px; }
.facts-box dd { margin: 0; font-family: var(--display); font-weight: 700; font-size: 17px; }
.levels { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.levels .lv { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 15px;
  background: var(--teal); color: #fff; font-variant-numeric: tabular-nums; }
.levels .lv.sec { background: transparent; border: 1.5px solid var(--gold); color: color-mix(in srgb, var(--gold) 70%, var(--fg)); }
.levels .word { font-family: var(--display); font-weight: 700; font-size: 15px; margin-inline: 4px 10px; }
.levels .word.sec { color: color-mix(in srgb, var(--gold) 70%, var(--fg)); }
.perks { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 6px; }
.perks li { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.perks li::before { content: "✓"; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--acc-text); background: color-mix(in srgb, var(--acc) 18%, transparent); flex: none; }
.support .reg { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 20px; }
.support .reg code { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: 1px; direction: ltr; user-select: all; }

/* ---------- day / night: follows the device until the student picks one; the choice is remembered on this device ---------- */
(() => {
  const root = document.documentElement, KEY = "nw-theme";
  const sysLight = matchMedia("(prefers-color-scheme: light)");
  const mode = () => root.dataset.theme === "light" || root.dataset.theme === "dark" ? root.dataset.theme : sysLight.matches ? "light" : "dark";
  const sync = () => { const m = mode(); root.dataset.mode = m;
    const b = document.getElementById("themeBtn"); if (b) b.setAttribute("aria-label", m === "dark" ? "التبديل إلى الوضع النهاري" : "التبديل إلى الوضع الليلي"); };
  try { const saved = localStorage.getItem(KEY); if (saved === "light" || saved === "dark") root.dataset.theme = saved; } catch {}
  sync();
  sysLight.addEventListener("change", sync);
  new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  document.getElementById("themeBtn").addEventListener("click", () => {
    const next = mode() === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem(KEY, next); } catch {}
  });
})();

    <img class="runner" src="nw_running.webp" alt="">
    <span class="finish"><span class="flag"></span>${progressLabel}</span></div>`;
}
function stage(t, inner, subjectLabel) {
  const sub = SUBJECTS[t.subject] || { g: [] };
  /* a photographed room for the subject when we have one; otherwise the line drawing and floating symbols */
  const scene = sub.bg ? "" : SCENES[t.subject] ? `<div class="scene" aria-hidden="true"><svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">${SCENES[t.subject]}</svg></div>` : "";
  return `<section class="stage${sub.bg ? " has-bg" : ""}"${sub.bg ? ` style="--bgimg:url('${sub.bg}')"` : ""}>${scene}${sub.bg ? "" : glyphs(sub.g)}
    <div class="stage-grid">
      <div class="copy">${inner}</div>
      <div class="window">
        <div class="pane"></div>
        ${t.photo ? `<div class="figure${t.photoEdge ? " edge-" + t.photoEdge : ""}"><img class="teacher" src="${t.photo}" alt="${esc(t.name)}"></div>` : `<span class="initials">${esc(short(t)[0])}</span>`}
        <span class="sill"></span>
        ${FX[t.subject] ? `<canvas class="fx" data-fx="${esc(t.subject)}" aria-hidden="true"></canvas>` : ""}
        ${subjectLabel ? `<span class="badge-subj">${esc(subjectLabel)}</span>` : ""}
      </div>
    </div>
    ${lane("خط الوصول")}</section>`;
}
function bib(y, s) { return `<span class="bib"><small>ماراثون نوافذ</small><b>${esc(y.short)}·${s.bib ? esc(s.bib) : String(s.id).padStart(2, "0")}</b></span>`; }
function mcard(t, y, s) {
  return `<a class="mcard" href="#${t.id}-${y.id}-${s.id}">
    <div class="thumb"><img src="${s.thumb}" alt="${esc(s.title)}" loading="lazy">${bib(y, s)}<span class="play-dot">${playIcon}</span></div>
    <div class="body"><h3>${esc(s.title)}</h3>
      <div class="meta">${esc(y.label)} · المقطع ${s.id === "1" ? "الأول" : esc(s.id)}</div>
      <div class="chips"><span class="chip acc">${lessonsWord(s.lessons.length)}</span><span class="chip">${esc(s.duration)}</span>${s.topics.slice(0, 2).map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div></div></a>`;
}

function mlane(t, y, s) {
  const href = `#${t.id}-${y.id}-${s.id}`;
  const done = new Set(store.get(`done:${t.id}:${y.id}:${s.id}`));
  const next = s.lessons.findIndex((_, i) => !done.has(i));
  const pct = Math.round((done.size / s.lessons.length) * 100);
  const bg = SUBJECTS[t.subject]?.bg;
  const label = done.size === s.lessons.length ? "أعد مشاهدة الماراثون" : done.size ? `تابع من المحطة ${String(next + 1).padStart(2, "0")}` : "ابدأ الماراثون";
  return `<article class="mlane"${bg ? ` style="--bgimg:url('${bg}')"` : ""}>
    <a class="mthumb" href="${href}" aria-label="${esc(s.title)}"><img src="${s.thumb}" alt="" loading="lazy">${bib(y, s)}<span class="play-dot">${playIcon}</span></a>
    <div class="mbody">
      <div><h3>${esc(s.title)}</h3><div class="meta">${esc(y.label)} · ${s.bib ? "نموذج مقترح" : `المقطع ${s.id === "1" ? "الأول" : esc(s.id)}`} · ${esc(s.duration)}</div></div>
      <div class="mprog"><span>${done.size ? `أنهيتَ ${done.size} من ${s.lessons.length} محطات` : (s.bib ? "نماذج مقترحة مع الحل المفصّل في فيديو واحد" : `${lessonsWord(s.lessons.length)} على خط واحد`)}</span><span class="flag" aria-hidden="true"></span>
        <div class="meter"><i style="width:${pct}%"></i></div></div>
      <ol class="mstations">${s.lessons.map(([n, tm], i) => `<li class="${done.has(i) ? "done" : ""}${i === next && done.size ? " next" : ""}">
        <span class="st">${String(i + 1).padStart(2, "0")}</span><span class="nm" title="${esc(n)}">${esc(n)}</span><span class="tm">${tm}</span></li>`).join("")}</ol>
      <div class="mfoot"><div class="chips">${s.files?.length ? `<span class="chip acc clip">${CLIP}${s.files.length} ملفات PDF</span>` : ""}${s.topics.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div>
        <a class="go" href="${href}">${playIcon}${label}</a></div>
    </div></article>`;
}

/* the marathons of one teacher: year tabs, the route of segments (ready / started / finished / upcoming), then one lane card */
const ORD = ["الأول", "الثاني", "الثالث", "الرابع", "الخامس", "السادس", "السابع", "الثامن"];
const SEL = {}; // per teacher: { y: year id, s: segment id } for this visit
const lockIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V8a3 3 0 0 0-6 0z"/></svg>';
const doneOf = (t, y, s) => new Set(store.get(`done:${t.id}:${y.id}:${s.id}`)).size;
const examsOf = (y) => y.exams || [];
const KIND_ICON = {
  lessons: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a1 1 0 0 0 0 2h13v2H6a3 3 0 0 1-3-3V5zm4 1v2h8V6z"/></svg>',
  exams: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6a1 1 0 0 1 1 1v1h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2V3a1 1 0 0 1 1-1zm1 2v2h4V4zm-2.3 9.3 1.4-1.4 1.9 1.9 4.4-4.4 1.4 1.4-5.8 5.8z"/></svg>' };
function marathonsBlock(t, fixedYear) {
  const st = (SEL[t.id] ||= {});
  /* two kinds: lesson marathons and proposed exam models (each kind lists only the years that have it) */
  const has = { lessons: t.years.some((y) => y.segments.length), exams: t.years.some((y) => examsOf(y).length) };
  if (fixedYear) { const fy = t.years.find((x) => x.id === fixedYear); if (fy && !fy.segments.length && examsOf(fy).length) st.k = "exams"; }
  if (!st.k || !has[st.k]) st.k = has.lessons ? "lessons" : "exams";
  const yearsK = t.years.filter((y) => (st.k === "lessons" ? y.segments.length : examsOf(y).length));
  const y = yearsK.find((x) => x.id === (fixedYear || st.y)) || yearsK[0];
  if (!y) return "";
  st.y = y.id;
  const nEx = t.years.reduce((a, x) => a + examsOf(x).length, 0);
  const ktabs = has.lessons && has.exams ? `<div class="ktabs" role="tablist" aria-label="نوع الماراثون">
    <button class="ktab" type="button" role="tab" data-kind="lessons" aria-selected="${st.k === "lessons"}">${KIND_ICON.lessons}ماراثونات الدروس</button>
    <button class="ktab" type="button" role="tab" data-kind="exams" aria-selected="${st.k === "exams"}">${KIND_ICON.exams}النماذج المقترحة <i>${nEx}</i></button></div>` : "";
  const ytabsK = !fixedYear && yearsK.length > 1 ? `<div class="ytabs" role="tablist" aria-label="السنة الدراسية">${yearsK.map((x) =>
    `<button class="ytab" type="button" role="tab" data-ytab="${x.id}" aria-selected="${x.id === y.id}"><b>${esc(x.short)}</b>${esc(x.label)}</button>`).join("")}</div>` : "";
  if (st.k === "exams") return ktabs + ytabsK + `<div class="lanes">${examsOf(y).map((s) => mlane(t, y, s)).join("")}</div>`;
  if (ktabs) return ktabs + ytabsK + lessonsRoute(t, y, st);
  return ytabsK + lessonsRoute(t, y, st);
}
function lessonsRoute(t, y, st) {
  const ready = y.segments.filter((s) => !s.soon);
  if (!ready.some((s) => s.id === st.s)) {
    const started = ready.find((s) => { const d = doneOf(t, y, s); return d > 0 && d < s.lessons.length; });
    st.s = (started || ready[ready.length - 1])?.id;
  }
  let reached = true;
  const route = `<ol class="route" aria-label="مقاطع ${esc(y.label)}">${y.segments.map((s, i) => {
    const n = String(i + 1).padStart(2, "0"), name = `المقطع ${ORD[i] || i + 1}`;
    if (s.soon) return `<li><button class="sdot soon" type="button" disabled><i>${lockIcon}</i><b>${name}</b><small>قريبًا</small></button></li>`;
    const d = doneOf(t, y, s), L = s.lessons.length, cls = d === L ? "done" : d ? "part" : "";
    const passed = reached; if (d < L) reached = false;
    return `<li class="${i && passed ? "passed" : ""}"><button class="sdot ${cls}" type="button" data-seg="${s.id}" style="--p:${Math.round((d / L) * 100)}%"
      aria-current="${s.id === st.s}"><i>${d === L ? "✓" : n}</i><b>${name}</b><small>${d ? `${d}/${L}` : lessonsWord(L)}</small></button></li>`;
  }).join("")}</ol>`;
  const s = ready.find((x) => x.id === st.s);
  return route + (s ? mlane(t, y, s) : "");
}
function rerenderTrack() {
  const el = document.getElementById("mtrack"); if (!el) return;
  const t = DATA.teachers.find((x) => x.id === el.dataset.t);
  el.innerHTML = marathonsBlock(t, el.dataset.fy || undefined);
}
document.addEventListener("click", (e) => {
  const el = document.getElementById("mtrack"); if (!el || !el.contains(e.target)) return;
  const st = SEL[el.dataset.t];
  const tab = e.target.closest("[data-ytab]"), seg = e.target.closest("[data-seg]");
  const kind = e.target.closest("[data-kind]");
  if (kind) { st.k = kind.dataset.kind; st.y = undefined; st.s = undefined; rerenderTrack(); return; }
  if (tab) { st.y = tab.dataset.ytab; st.s = undefined; rerenderTrack(); }
  else if (seg) { st.s = seg.dataset.seg; rerenderTrack(); }
});

function viewTeacher(t) {
  const segs = t.years.flatMap((y) => y.segments.filter((s) => !s.soon).map((s) => ({ y, s })));
  if (!segs.length) {
    return stage(t, teacherCopy(t, `<div class="clock"><div><b>قريبًا</b><span>أول ماراثون</span></div></div>`,
      `ماراثونات ${esc(t.name)} قيد التحضير: كلّ دروس المقطع في فيديو واحد، مرتبةً حسب السنة والمقطع. احفظ هذا الرابط وعُد إليه.`), t.subject) + bands() + `
    <div class="sec"><h2>الماراثونات</h2><small>على خط الانطلاق</small></div>
    <div class="grid"><div class="mcard soon"><div class="thumb"><img src="nw_thinking.webp" alt=""></div>
      <div class="body"><h3>نوّاف يجهّز أول ماراثون</h3><div class="meta">تابع حسابات الأستاذ ليصلك الجديد أولًا</div></div></div></div>` + supportBlock(t);
  }

function viewYear(t, y) {
  return crumbs([[t.name, t.id], [y.label]]) + `

  <div id="mtrack" data-t="${t.id}" data-fy="${y.id}">${marathonsBlock(t, y.id)}</div>`;
}

function viewMarathon(t, y, s) {
  const key = `done:${t.id}:${y.id}:${s.id}`;
  const done = new Set(store.get(key));
  const next = s.lessons.findIndex((_, i) => !done.has(i));
  const pct = Math.round((done.size / s.lessons.length) * 100);
  const finished = done.size === s.lessons.length;
  const yt = s.youtube;
  const link = (time) => (yt ? `https://www.youtube.com/watch?v=${yt}&t=${secs(time)}s` : null);
  return crumbs([[t.name, t.id], [y.label, `${t.id}-${y.id}`], [s.title]]) + `
  <div class="head">${miniArch(t)}<div><h1>${esc(s.title)}</h1><p>${esc(t.name)} · ${esc(t.subject || "")} · ${esc(y.label)}</p></div></div>
  <div class="mara">
    <div>
      <div class="player" id="ytPlayer"${yt ? ` data-yt="${yt}" data-title="${esc(s.title)}"` : ""}><img src="${s.thumb}" alt="${esc(s.title)}">${bib(y, s)}
        <div class="play">${yt ? `<button class="btn red" type="button" data-seek="0">${playIcon} شاهد الماراثون</button>`
          : `<span class="btn ghost">يُنشر قريبًا على يوتيوب</span>`}</div></div>
      ${yt ? `<a class="yt-out" href="https://www.youtube.com/watch?v=${yt}" target="_blank" rel="noopener">فتح على يوتيوب ↗</a>` : ""}
      <div class="chips facts"><span class="chip acc">${lessonsWord(s.lessons.length)}</span><span class="chip">${esc(s.duration)}</span>
        ${s.topics.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div>
      <div class="progress">
        <img src="${finished ? "nw_gold_medal" : done.size ? "nw_pointing" : "nw_running"}.webp" alt="">
        <div><b>${finished ? "أحسنت يا بطل! وصلت إلى خط النهاية" : done.size ? `محطتك التالية: ${esc(s.lessons[next][0])}` : "ابدأ من المحطة الأولى"}</b>
          <span>${done.size} من ${s.lessons.length} · ${pct}%</span>
          <div class="meter"><i style="width:${pct}%"></i></div></div>
      </div>
      ${filesBlock(s)}
    </div>
    <div>
      <div class="sec" style="margin-top:0"><h2>محطات الماراثون</h2></div>
      <ol class="lessons">${s.lessons.map(([title, time], i) => `
        <li class="lesson${done.has(i) ? " done" : ""}${i === next && !finished ? " next" : ""}">
          <span class="station">${String(i + 1).padStart(2, "0")}</span>
          <div class="t"><b>${esc(title)}</b>${link(time) ? `<a href="${link(time)}" data-seek="${secs(time)}">▶ شاهد من ${time}</a>` : `<span>يبدأ عند ${time}</span>`}</div>
          <label class="check" for="c${i}"><input type="checkbox" id="c${i}" data-i="${i}" ${done.has(i) ? "checked" : ""}> أنهيته</label>
        </li>`).join("")}</ol>
    </div>
  </div>`;
}

    ${t.support ? `<h4>دروس الدعم عن بعد</h4><ul><li><a href="#${t.id}-support"${on(`${t.id}-support`)}><span class="lvl">زوم</span>المستويات والتسجيل</a></li></ul>` : ""}
    ${socials ? `<h4>تابع الأستاذ</h4><ul>${socials}</ul>` : ""}
    <h4>منصة نوافذ</h4><ul><li><a href="#join"><span class="lvl">+</span>سجّل في نوافذ</a></li></ul>`;
}
const setNav = (open) => { document.body.classList.toggle("nav-open", open); $("#menuBtn").setAttribute("aria-expanded", String(open)); };
$("#menuBtn").addEventListener("click", () => setNav(!document.body.classList.contains("nav-open")));
$("#scrim").addEventListener("click", () => setNav(false));
$("#side").addEventListener("click", (e) => { if (e.target.closest("a")) setNav(false); });
addEventListener("keydown", (e) => { if (e.key === "Escape") setNav(false); });

/* attached PDF files: preview, view in a full-screen dialog, download */
const CLIP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 6.5v10a4.5 4.5 0 0 1-9 0V5a3 3 0 0 1 6 0v10.5a1.5 1.5 0 0 1-3 0V6.5H9v9a3 3 0 0 0 6 0V5a4.5 4.5 0 0 0-9 0v11.5a6 6 0 0 0 12 0v-10z"/></svg>';
const KIND_NAME = { topic: "موضوع", solution: "موضوع + الحل النموذجي", summary: "ملخص الدروس", exercises: "تمارين" };
function filesBlock(s) {
  if (!s.files || !s.files.length) return "";
  const eye = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c5 0 9 4.5 10 7-1 2.5-5 7-10 7S3 14.5 2 12c1-2.5 5-7 10-7zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>';
  const down = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3h2v9.2l3.3-3.3 1.4 1.4L12 16l-5.7-5.7 1.4-1.4 3.3 3.3zM5 18h14v2H5z"/></svg>';
  return `<section class="files" aria-label="الملفات المرفقة"><div class="files-h">${CLIP}<b>الملفات المرفقة</b><i>${s.files.length}</i></div><div class="file-list">${s.files.map((f) => `
    <article class="file" data-kind="${f.kind}">
      <button class="pv" type="button" data-pdf="${f.url}" data-title="${esc(f.title)}" aria-label="عرض ${esc(f.title)}"><img src="${f.preview}" alt="" loading="lazy"><span class="pdf">PDF</span></button>
      <div class="fb"><b title="${esc(f.title)}">${esc(f.title)}</b><small><span class="kind">${KIND_NAME[f.kind] || "ملف"}</span>${f.pages} صفحات · ${esc(f.size)}</small></div>
      <div class="acts"><button class="view" type="button" data-pdf="${f.url}" data-title="${esc(f.title)}" title="عرض" aria-label="عرض">${eye}</button><a class="dl" href="${f.url}" download title="تحميل" aria-label="تحميل">${down}</a></div>
    </article>`).join("")}</div></section>`;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-pdf]"); if (!b) return;
  const url = b.dataset.pdf, dlg = document.getElementById("pdfDlg");
  /* phones open PDFs better in their own viewer */
  if (matchMedia("(max-width: 700px)").matches || !dlg.showModal) { window.open(url, "_blank", "noopener"); return; }
  document.getElementById("pdfTitle").textContent = b.dataset.title || "";
  document.getElementById("pdfDl").href = url; document.getElementById("pdfNew").href = url;
  document.getElementById("pdfFrame").src = url + "#view=FitH";
  dlg.showModal();
});
document.getElementById("pdfClose").addEventListener("click", () => document.getElementById("pdfDlg").close());
document.getElementById("pdfDlg").addEventListener("close", () => { document.getElementById("pdfFrame").src = "about:blank"; });
document.getElementById("pdfDlg").addEventListener("click", (e) => { if (e.target.id === "pdfDlg") e.target.close(); });
/* ---------- router: #<teacher>, #<teacher>-<year>, #<teacher>-<year>-<segment> ---------- */
function render() {
  const h = (location.hash || "#home").slice(1);
  if (h === "join") { $("#join").scrollIntoView({ behavior: "smooth" }); return; }
  const [ti, yi, si] = h.split("-");
  const t = DATA.teachers.find((x) => x.id === ti);
  const y = t && yi && yi !== "support" ? t.years.find((x) => x.id === yi) : null;
  const s = y && si ? (y.segments.find((x) => x.id === si && !x.soon) || (y.exams || []).find((x) => x.id === si)) : null;
  document.documentElement.style.setProperty("--acc", (t && SUBJECTS[t.subject]?.c) || "#f2bf3a");
  renderSide(h, t);
  $("#brand").setAttribute("href", t ? `#${t.id}` : "#home");
  $("#joinText").textContent = t ? `${t.name} يرافقك خطوة بخطوة على منصة نوافذ التعليمية: حصص مباشرة، حصص مسجلة، وتمارين محلولة.`
    : "أساتذة نوافذ يرافقونك خطوة بخطوة على منصة نوافذ التعليمية: حصص مباشرة، حصص مسجلة، وتمارين محلولة.";
  document.title = t ? `ماراثون نوافذ · ${t.name}` : "ماراثون نوافذ";
  $("#joinContact").innerHTML = contactBtns(t ? `السلام عليكم، أريد التسجيل في منصة نوافذ مع ${t.name}.` : "السلام عليكم، أريد التسجيل في منصة نوافذ.");
  const app = $("#app");
  app.innerHTML = s ? viewMarathon(t, y, s) : y ? viewYear(t, y) : t ? viewTeacher(t) : viewLanding();
  startFx(); armReveal();
  if (s) app.querySelectorAll("input[data-i]").forEach((el) => el.addEventListener("change", () => {
    const set = new Set(store.get(`done:${t.id}:${y.id}:${s.id}`));
    el.checked ? set.add(+el.dataset.i) : set.delete(+el.dataset.i);
    store.set(`done:${t.id}:${y.id}:${s.id}`, [...set]);
    const sy = scrollY; render(); scrollTo(0, sy);
  }));
}
/* #<teacher>-support shows the teacher page and lands on the support section */
const toSupport = () => { const el = document.getElementById(location.hash.slice(1) + "-sec"); if (location.hash.endsWith("-support") && el) { el.scrollIntoView({ behavior: "smooth" }); return true; } return false; };
addEventListener("hashchange", () => { render(); if (!toSupport()) scrollTo(0, 0); });
render(); toSupport();
/* play the marathon inside the page; a station jumps the same player to its lesson */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-seek]"); if (!b) return;
  const p = document.getElementById("ytPlayer"); if (!p || !p.dataset.yt) return;
  e.preventDefault();
  const start = parseInt(b.dataset.seek, 10) || 0;
  p.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${p.dataset.yt}?start=${start}&autoplay=1&rel=0&modestbranding=1&playsinline=1"
    title="${p.dataset.title || "ماراثون نوافذ"}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  p.scrollIntoView({ behavior: "smooth", block: "center" });
});
/* hero button: glide straight to the Zoom registration (levels + contact) without reloading the page */
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-jump]"); if (!a) return;
  const sec = document.getElementById(a.dataset.jump); if (!sec) return;
  e.preventDefault();
  sec.scrollIntoView({ behavior: "smooth", block: "start" });
  const box = sec.nextElementSibling;
  if (box) { box.classList.remove("flash"); void box.offsetWidth; box.classList.add("flash"); }
});
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-copy]"); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "تم النسخ"; }
  catch { const c = b.previousElementSibling; const r = document.createRange(); r.selectNodeContents(c); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = "حدّد الرقم وانسخه"; }
  setTimeout(() => (b.textContent = "نسخ الرقم"), 2000);
});

</script>
